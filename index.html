<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <main>
    <article class="card">
      <div class="card__image-container">
        <img src="./assets/images/illustration-article.svg" alt="Illustration représentant un article sur les fondations HTML et CSS">
      </div>

      <div class="card__content">
        <span class="card__tag">Learning</span>
        <span class="card__date">Published 21 Dec 2023</span>
        
        <h1 class="card__title">
          <a href="#">HTML & CSS foundations</a>
        </h1>

        <p class="card__description">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>
      
      <div class="card__author">
        <img src="./assets/images/image-avatar.webp" alt="Avatar de Greg Hooper">
        <span class="card__author-name">Greg Hooper</span>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/Ruth-Bokondine-dev" target="_blank" rel="noopener">Ruth Bokondiné</a>.
  </footer>

</body>
</html>
